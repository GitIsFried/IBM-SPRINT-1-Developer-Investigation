<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>AI and Speech-to-Text integration data flow</title>
<desc>Content input flows through STT and AI processing into a structured result, then to backend storage.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="680" height="260" fill="#ffffff"/>

<rect x="20" y="80" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="85" y="100" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Content input</text>
<text x="85" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Video / audio</text>

<line x1="150" y1="108" x2="188" y2="108" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="188" y="80" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="263" y="100" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">STT / AI processing</text>
<text x="263" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Transcribe, then analyze</text>

<line x1="338" y1="108" x2="376" y2="108" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="376" y="80" width="150" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="451" y="100" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Structured result</text>
<text x="451" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">JSON output</text>

<line x1="526" y1="108" x2="564" y2="108" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="564" y="80" width="96" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="612" y="100" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Backend</text>
<text x="612" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Storage</text>

<text x="85" y="165" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">API key auth</text>
<text x="263" y="165" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">STT basic auth,</text>
<text x="263" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">AI IAM bearer token</text>
<text x="451" y="165" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">generated_text,</text>
<text x="451" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">transcript, confidence</text>
<text x="612" y="165" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">Auditor</text>
<text x="612" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">interface</text>
</svg>
